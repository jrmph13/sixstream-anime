      <source src="${src.url}" type="video/mp4">
    </video>
    <div class="watch-type-badge mp4">MP4</div>`;
    enhanceVideo('hv');
    document.getElementById('hv')?.play().catch(()=>{});
    setDownload(src.url,'HD Download','Direct MP4 source',`6Stream-jhamesmartin-${baseName}.mp4`);
    toast('MP4 stream', true);

  } else if(src.kind==='direct'){
    wrap.innerHTML=`<div class="player-msg">
      <div class="pi" style="font-size:1.5rem">⬇</div>
      <div style="margin-bottom:8px">Direct download link</div>
      <a href="${src.url}" target="_blank" rel="noopener"
         style="background:var(--accent);color:#fff;padding:8px 18px;border-radius:7px;font-size:.84rem;text-decoration:none;font-weight:700;">Open Download</a>
    </div>`;
    setDownload(src.url,'Download','Direct source',`6Stream-jhamesmartin-${baseName}`);
    toast('Download link ready', true);

  } else if(src.kind==='hls'){
    if(!src.url.startsWith('http')){
      toast('Invalid stream URL', false);
      return;
    }
    const proxied = `${API_ORIGIN}/api/hls?url=${encodeURIComponent(src.url)}`;
    playHLS(proxied, [], null, null, {label: src.quality || 'HLS', cls:'hls'});
    const downloadUrl = `${API_ORIGIN}/api/hls-download?url=${encodeURIComponent(src.url)}&name=${encodeURIComponent(baseName)}`;
    setDownload(downloadUrl, 'HD Download', `Full video MP4 (${src.quality || 'HLS'})`, `6Stream-jhamesmartin-${baseName}.mp4`);
    toast(`${src.quality || 'HLS'} stream`, true);

  } else {
    toast('Unknown source type', false);
  }
}

function ico(name){
  const icons={
    play:'<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
    pause:'<svg viewBox="0 0 24 24"><path d="M8 5v14"/><path d="M16 5v14"/></svg>',
    volume:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8a5 5 0 0 1 0 8"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    mute:'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M19 9l-6 6"/><path d="M13 9l6 6"/></svg>',
    full:'<svg viewBox="0 0 24 24"><path d="M8 3H3v5"/><path d="M16 3h5v5"/><path d="M21 16v5h-5"/><path d="M3 16v5h5"/></svg>'
  };
  return icons[name]||'';
}

function enhanceVideo(videoId='hv', hlsInstance=null, badge=null){
  const wrap=document.getElementById('player');
  const v=document.getElementById(videoId);
  if(!wrap||!v) return;
  wrap.querySelector('.video-controls')?.remove();
  v.controls=false;

  const controls=document.createElement('div');
  controls.className='video-controls';
  controls.innerHTML=`
    <input class="vc-progress" type="range" min="0" max="1000" value="0" aria-label="Seek">
    <div class="vc-row">
      <button class="vc-btn vc-play" type="button" title="Play/Pause">${ico('play')}</button>
      <button class="vc-btn vc-mute" type="button" title="Mute">${ico('volume')}</button>
      <input class="vc-vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume">
      <span class="vc-time">0:00 / 0:00</span>
      <span class="vc-type" id="vc-type-badge"></span>
      <div class="vc-spacer"></div>
      <select class="vc-quality" aria-label="Quality" style="display:none">
        <option value="-1">Auto</option>
      </select>
      <select class="vc-speed" aria-label="Playback speed">
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
      <select class="vc-sub" aria-label="Subtitle" disabled>
        <option value="-1">Sub: Off</option>
      </select>
      <button class="vc-btn vc-full" type="button" title="Fullscreen">${ico('full')}</button>
    </div>`;
  wrap.appendChild(controls);

  // Set Sub/Dub/HLS badge in controls
  const typeBadge=controls.querySelector('#vc-type-badge');
  if(typeBadge && badge?.label){
    typeBadge.textContent=badge.label;
    typeBadge.className='vc-type '+(badge.cls||'');
  } else if(typeBadge){
    typeBadge.style.display='none';
  }

  const playBtn=controls.querySelector('.vc-play');
  const muteBtn=controls.querySelector('.vc-mute');
  const progress=controls.querySelector('.vc-progress');
  const volume=controls.querySelector('.vc-vol');
  const time=controls.querySelector('.vc-time');
  const qualSel=controls.querySelector('.vc-quality');
  const speed=controls.querySelector('.vc-speed');
  const subSel=controls.querySelector('.vc-sub');
  const fullBtn=controls.querySelector('.vc-full');
  let seeking=false;
  let idleTimer=null;
  let lastTrackCount=-1;

  const fmt=t=>{
    if(!Number.isFinite(t)||t<0) return '0:00';
    const h=Math.floor(t/3600), m=Math.floor((t%3600)/60), s=Math.floor(t%60);
    return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`;
  };
  const showControls=()=>{
    wrap.classList.remove('controls-idle');
    clearTimeout(idleTimer);
    idleTimer=setTimeout(()=>wrap.classList.add('controls-idle'),2000);
  };
  const showCenterPop=(name)=>{
    wrap.querySelector('.center-pop')?.remove();
    const pop=document.createElement('div');
    pop.className='center-pop';
    pop.innerHTML=ico(name);
    wrap.appendChild(pop);
    pop.addEventListener('animationend',()=>pop.remove(),{once:true});
  };
  const syncFullscreenClass=()=>{
    wrap.classList.toggle('is-fullscreen', document.fullscreenElement===wrap || document.webkitFullscreenElement===wrap);
  };
  const sync=()=>{
    playBtn.innerHTML=v.paused?ico('play'):ico('pause');
    muteBtn.innerHTML=(v.muted||v.volume===0)?ico('mute'):ico('volume');
    if(!seeking && Number.isFinite(v.duration) && v.duration>0){
      progress.value=Math.round((v.currentTime/v.duration)*1000);
    }
    time.textContent=`${fmt(v.currentTime)} / ${fmt(v.duration)}`;
  };
  const applySubtitle=(value)=>{
    const tracks=Array.from(v.textTracks||[]);
    tracks.forEach((track,i)=>{
      track.mode=String(i)===String(value)?'showing':'disabled';
    });
  };
  const setupSubtitles=()=>{
    const tracks=Array.from(v.textTracks||[]);
    if(!subSel) return;
    if(!tracks.length){
      subSel.disabled=true;
      subSel.innerHTML='<option value="-1">Sub: Off</option>';
      lastTrackCount=0;
      return;
    }
    if(tracks.length===lastTrackCount && subSel.options.length===tracks.length+1) return;
    lastTrackCount=tracks.length;
    subSel.disabled=false;
    subSel.innerHTML=['<option value="-1">Sub: Off</option>'].concat(tracks.map((track,i)=>{
      const label=track.label||track.language||`Subtitle ${i+1}`;
      return `<option value="${i}">Sub: ${label}</option>`;
    })).join('');
    const englishIndex=tracks.findIndex(track=>/english|eng|^en$/i.test(`${track.label||''} ${track.language||''}`));
    const selected=englishIndex>=0?englishIndex:0;
    subSel.value=String(selected);
    applySubtitle(selected);
  };

  const togglePlayback=()=>{
    const willPlay=v.paused;
    willPlay?v.play().catch(()=>{}):v.pause();
    showCenterPop(willPlay?'play':'pause');
  };
  playBtn.onclick=togglePlayback;

  // ── Double-tap (mobile) / double-click (desktop) seek ─────────────────
  const SEEK_SEC=10;
  let _tapLast=0, _tapSide=null, _tapTimer2=null;
  let _tsX=0, _tsY=0;

  const showSeekFlash=(isLeft)=>{
    wrap.querySelectorAll('.seek-flash').forEach(el=>el.remove());
    const el=document.createElement('div');
    el.className=`seek-flash ${isLeft?'left':'right'}`;
    const arrow=isLeft
      ? `<svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6 8.5 6V6l-8.5 6z"/></svg>`
      : `<svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>`;
    el.innerHTML=`<div class="sf-inner">${arrow}<span>${isLeft?'−':'+'}${SEEK_SEC}s</span></div>`;
    wrap.appendChild(el);
    el.addEventListener('animationend',()=>el.remove(),{once:true});
  };

  const doVideoSeek=(isLeft)=>{
    v.currentTime=Math.max(0,Math.min(v.duration||0,v.currentTime+(isLeft?-SEEK_SEC:SEEK_SEC)));
    showSeekFlash(isLeft);
    showControls();
  };

  // Touch events — detect double-tap
  wrap.addEventListener('touchstart',(e)=>{
    if(e.target.closest('.video-controls,.skip-intro-btn,.intro-overlay')) return;
    _tsX=e.touches[0].clientX; _tsY=e.touches[0].clientY;
  },{passive:true});

  wrap.addEventListener('touchend',(e)=>{
    if(e.target.closest('.video-controls,.skip-intro-btn,.intro-overlay')) return;
    const dx=Math.abs(e.changedTouches[0].clientX-_tsX);
    const dy=Math.abs(e.changedTouches[0].clientY-_tsY);
    if(dx>40||dy>40) return; // swipe — ignore
    e.preventDefault(); // suppress synthetic click on touch
    const rect=wrap.getBoundingClientRect();
    const isLeft=_tsX-rect.left<rect.width/2;
    const now=Date.now();
    if(now-_tapLast<280&&_tapSide===isLeft){
      // Double-tap!
      clearTimeout(_tapTimer2); _tapTimer2=null; _tapLast=0; _tapSide=null;
      doVideoSeek(isLeft);
    } else {
      // First tap — wait to see if second tap follows
      _tapLast=now; _tapSide=isLeft;
      clearTimeout(_tapTimer2);
      _tapTimer2=setTimeout(()=>{ togglePlayback(); _tapTimer2=null; },280);
    }
  },{passive:false});

  // Mouse click — play/pause (desktop)
  let _suppressClick=false;
  wrap.addEventListener('touchstart',()=>{ _suppressClick=true; },{passive:true});
  wrap.addEventListener('click',(e)=>{
    if(e.target.closest('.video-controls,.skip-intro-btn,.intro-overlay,.center-pop')) return;
    if(_suppressClick){ _suppressClick=false; return; }
    togglePlayback();
  });

  // Desktop double-click — seek left/right
  wrap.addEventListener('dblclick',(e)=>{
    if(e.target.closest('.video-controls,.skip-intro-btn,.intro-overlay,.center-pop')) return;
    const rect=wrap.getBoundingClientRect();
    doVideoSeek(e.clientX-rect.left<rect.width/2);
  });
  // ──────────────────────────────────────────────────────────────────────

  muteBtn.onclick=()=>{ v.muted=!v.muted; sync(); };
  volume.oninput=()=>{ v.volume=parseFloat(volume.value); v.muted=v.volume===0; sync(); };
  speed.onchange=()=>{ v.playbackRate=parseFloat(speed.value)||1; };
  subSel.onchange=()=>applySubtitle(subSel.value);

  // Quality selector — populated after HLS manifest is parsed
  if(hlsInstance && qualSel){
    const populateQuality=()=>{
      const levels=hlsInstance.levels||[];
      if(levels.length<2){ qualSel.style.display='none'; return; }
      qualSel.style.display='';
      qualSel.innerHTML='<option value="-1">Auto</option>'
        +levels.map((l,i)=>`<option value="${i}">${l.height?l.height+'p':Math.round((l.bitrate||0)/1000)+'k'}</option>`).join('');
      qualSel.value=String(hlsInstance.currentLevel);
    };
    hlsInstance.on(Hls.Events.MANIFEST_PARSED, populateQuality);
    hlsInstance.on(Hls.Events.LEVEL_SWITCHED, ()=>{ qualSel.value=String(hlsInstance.currentLevel); });
    qualSel.onchange=()=>{
      hlsInstance.currentLevel=parseInt(qualSel.value,10);
      toast(qualSel.value==='-1'?'Auto quality':qualSel.options[qualSel.selectedIndex].text, true);
    };
    populateQuality();
  }
  fullBtn.onclick=async()=>{
    try{
      if(document.fullscreenElement){
        await document.exitFullscreen();
      } else if(wrap.requestFullscreen){
        await wrap.requestFullscreen();
      } else if(v.webkitEnterFullscreen){
        v.webkitEnterFullscreen();
      }
      syncFullscreenClass();
    }catch(_){}
  };
  document.addEventListener('fullscreenchange',syncFullscreenClass);
  document.addEventListener('webkitfullscreenchange',syncFullscreenClass);
  progress.oninput=()=>{ seeking=true; };
  progress.onchange=()=>{
    if(Number.isFinite(v.duration) && v.duration>0) v.currentTime=(parseInt(progress.value,10)/1000)*v.duration;
    seeking=false; sync();
  };

  ['loadedmetadata','timeupdate','play','pause','volumechange','durationchange'].forEach(ev=>v.addEventListener(ev,sync));
  ['loadedmetadata','loadeddata','canplay'].forEach(ev=>v.addEventListener(ev,setupSubtitles));
  v.querySelectorAll('track').forEach(track=>track.addEventListener('load',setupSubtitles));
  ['mousemove','mousedown','touchstart','touchmove','keydown'].forEach(ev=>wrap.addEventListener(ev,showControls));
  v.addEventListener('pause',showControls);
  v.addEventListener('play',showControls);
  v.addEventListener('ended',()=>{
    showControls();
    if(currentEps && currentEps.length>0){
      const nextIdx=activeEpIdx+1;
      if(nextIdx<currentEps.length) showAutoNext(nextIdx);
      else showEndOfSeries();
    } else if(hCurrentRelated && hCurrentRelated.length>0){
      showHanimeEndCard();
    }
  });
  sync();
  setupSubtitles();
  setTimeout(setupSubtitles,300);
  showControls();
}

// ── HLS PLAYER ────────────────────────────────────────────────────────────────
let _activeHls = null;

function playHLS(m3u8Url, subs, intro, outro, badge=null){
  stopCurrentVideo();
  const wrap=document.getElementById('player');
  const escAttr=value=>String(value||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const tracks=(subs||[]).map(s=>{
    const label=s.label||s.lang||s.srclang||'English';
    const lang=s.lang||s.srclang||(/english|eng/i.test(label)?'en':'');
    return `<track kind="subtitles" label="${escAttr(label)}" src="${escAttr(s.url)}" srclang="${escAttr(lang)}" ${s.default?'default':''}>`;
  }).join('');
  wrap.innerHTML=`
    <video id="hv" autoplay playsinline preload="auto" crossorigin="anonymous" style="width:100%;height:100%;background:#000;">${tracks}</video>
    <div class="intro-overlay" id="intro-overlay">
      <div class="intro-logo">6stream</div>
      <div class="intro-bar"><div class="intro-fill"></div></div>
      <div class="intro-by">by jhames martin</div>
    </div>`;
  const v=document.getElementById('hv');

  if(badge?.label){
    wrap.insertAdjacentHTML('beforeend', `<div class="watch-type-badge ${badge.cls||''}">${badge.label}</div>`);
  }

  // Skip intro button — positioned above custom controls
  const skipBtn=document.createElement('button');
  skipBtn.className='skip-intro-btn';
  skipBtn.textContent='Skip Intro ⏭';
  wrap.appendChild(skipBtn);
  skipBtn.style.display='none';

  // Skip outro button
  const skipOutroBtn=document.createElement('button');
  skipOutroBtn.className='skip-intro-btn';
  skipOutroBtn.style.right='14px';
  skipOutroBtn.style.bottom='80px';
  skipOutroBtn.textContent='Skip Outro ⏭';
  skipOutroBtn.style.display='none';
  wrap.appendChild(skipOutroBtn);

  if(intro?.end>0){
    skipBtn.onclick=()=>{ v.currentTime=intro.end; skipBtn.style.display='none'; };
    v.addEventListener('timeupdate',()=>{
      const t=v.currentTime;
      skipBtn.style.display=(t>=intro.start&&t<intro.end)?'block':'none';
    });
  }
  if(outro?.end>0){
    skipOutroBtn.onclick=()=>{ v.currentTime=outro.end; skipOutroBtn.style.display='none'; };
    v.addEventListener('timeupdate',()=>{
      const t=v.currentTime;
      skipOutroBtn.style.display=(t>=outro.start&&t<outro.end)?'block':'none';
    });
  }

  // Remove intro overlay after animation (fallback)
  setTimeout(()=>document.getElementById('intro-overlay')?.remove(), 2500);

  // Whoosh sound via Web Audio API
  playWhoosh();

  if(Hls.isSupported()){
    const hls=new Hls({enableWorker:true,lowLatencyMode:false,startLevel:-1});
    _activeHls=hls;
    hls.loadSource(m3u8Url); hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{
      enhanceVideo('hv', hls, badge);
      v.play().catch(()=>{});
    });
    hls.on(Hls.Events.ERROR,(_,d)=>{
      if(d.fatal) wrap.innerHTML=`<div class="player-msg err"><div class="pi">!</div><div>HLS error: ${d.type}</div></div>`;
    });
  } else if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=m3u8Url; enhanceVideo('hv', null, badge); v.play().catch(()=>{});
  } else {
    wrap.innerHTML=`<div class="player-msg err"><div class="pi">!</div><div>HLS not supported.</div></div>`;
  }
}

// ── Whoosh SFX (Web Audio — no file needed) ───────────────────────────────────
function playWhoosh(){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();

    // Pink-noise buffer
    const bufLen=ctx.sampleRate*0.55;
    const buf=ctx.createBuffer(1,bufLen,ctx.sampleRate);
    const data=buf.getChannelData(0);
    let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0;
    for(let i=0;i<bufLen;i++){
      const w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759;
      b2=0.96900*b2+w*0.1538520; b3=0.86650*b3+w*0.3104856;
      b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      data[i]=(b0+b1+b2+b3+b4+b5+w*0.5362)*0.11;
    }

    const src=ctx.createBufferSource();
    src.buffer=buf;

    // Bandpass — gives the "whoosh" shape
    const bp=ctx.createBiquadFilter();
    bp.type='bandpass'; bp.frequency.setValueAtTime(600,ctx.currentTime);
    bp.frequency.linearRampToValueAtTime(3200,ctx.currentTime+0.18);
    bp.frequency.linearRampToValueAtTime(400,ctx.currentTime+0.52);
    bp.Q.value=1.2;

    // Gain envelope: fade in fast, fade out
    const gain=ctx.createGain();
    gain.gain.setValueAtTime(0,ctx.currentTime);
    gain.gain.linearRampToValueAtTime(0.9,ctx.currentTime+0.06);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.52);

    src.connect(bp); bp.connect(gain); gain.connect(ctx.destination);
    src.start(ctx.currentTime);
    src.stop(ctx.currentTime+0.55);
    src.onended=()=>{ try{ if(ctx.state!=='closed') ctx.close().catch(()=>{}); }catch(_){} };
  }catch(_){}
}

// ── Auto-next episode ─────────────────────────────────────────────────────────
let _autoNextTimer = null;

function showAutoNext(nextIdx) {
  const wrap = document.getElementById('player');
  if (!wrap) return;
  const ep = currentEps[nextIdx];
  if (!ep) return;
  cancelAutoNext();
  const overlay = document.createElement('div');
  overlay.className = 'auto-next-overlay';
  overlay.innerHTML = `<div class="auto-next-card">
    <div class="an-label">Next Episode</div>
    <div class="an-ep">${ep.title || 'Episode ' + (ep.epNum ?? nextIdx + 1)}</div>
    <div class="an-ring">
      <svg viewBox="0 0 60 60">
        <circle class="an-ring-bg" cx="30" cy="30" r="26"/>
        <circle class="an-ring-fill" cx="30" cy="30" r="26"/>
      </svg>
      <div class="an-num" id="an-num">4</div>
    </div>
    <div class="an-btns">
      <button class="an-btn" onclick="cancelAutoNext()">Cancel</button>
      <button class="an-btn primary" onclick="doAutoNext(${nextIdx})">Play Now</button>
    </div>
  </div>`;
  wrap.appendChild(overlay);
  let count = 4;
  const tick = () => {
    count--;
    const el = document.getElementById('an-num');
    if (el) el.textContent = count;
    if (count <= 0) doAutoNext(nextIdx);
    else _autoNextTimer = setTimeout(tick, 1000);
  };
  _autoNextTimer = setTimeout(tick, 1000);
}

function cancelAutoNext() {
  clearTimeout(_autoNextTimer);
  _autoNextTimer = null;
  document.querySelector('.auto-next-overlay')?.remove();
}

function doAutoNext(nextIdx) {
  clearTimeout(_autoNextTimer);
  _autoNextTimer = null;
  document.querySelector('.auto-next-overlay')?.remove();
  selectEp(nextIdx);
}

function showEndOfSeries() {
  const wrap = document.getElementById('player');
  if (!wrap) return;
  cancelAutoNext();
  const overlay = document.createElement('div');
  overlay.className = 'auto-next-overlay';
  overlay.innerHTML = `<div class="auto-next-card">
    <div class="an-label" style="color:var(--accent2)">Series Complete</div>
    <div class="an-ep" style="font-size:1.05rem;">All episodes watched! 🎉</div>
    <div class="an-btns" style="margin-top:14px;">
      <button class="an-btn" onclick="cancelAutoNext()">Stay</button>
      <button class="an-btn primary" onclick="cancelAutoNext();goHome()">Find New Anime</button>
    </div>
  </div>`;
  wrap.appendChild(overlay);
}

function showHanimeEndCard() {
  const wrap = document.getElementById('player');
  if (!wrap) return;
  cancelAutoNext();
  const related = (hCurrentRelated || []).slice(0, 3);
  const overlay = document.createElement('div');
  overlay.className = 'auto-next-overlay';
  overlay.innerHTML = `<div class="auto-next-card" style="max-width:300px;">
    <div class="an-label" style="color:var(--accent2)">Video Ended</div>
    <div class="an-ep">Watch something related?</div>
    <div style="display:flex;flex-direction:column;gap:6px;margin:10px 0;">
      ${related.map(r => `<div onclick="cancelAutoNext();hOpenModal('${(r.slug||'').replace(/'/g,"\\'")}');"
        style="display:flex;gap:8px;align-items:center;padding:7px 9px;border-radius:8px;border:1px solid var(--border);cursor:pointer;background:var(--bg3);">
        <img src="${hImg(r.poster||r.cover||'')}" style="width:44px;height:30px;object-fit:cover;border-radius:4px;flex-shrink:0;" onerror="this.style.opacity=0"/>
        <div style="flex:1;min-width:0;font-size:.74rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;">${r.title||''}</div>
      </div>`).join('')}
    </div>
    <div class="an-btns">
      <button class="an-btn" onclick="cancelAutoNext()">Dismiss</button>
      <button class="an-btn primary" onclick="cancelAutoNext();goHome()">Browse</button>
    </div>
  </div>`;
  wrap.appendChild(overlay);
}
