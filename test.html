<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>6stream</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest/dist/hls.min.js"></script>
<style>
:root{
  --bg:#0f0f13;--bg2:#16161e;--bg3:#1e1e2a;
  --accent:#7c3aed;--accent2:#a855f7;
  --text:#e2e8f0;--muted:#94a3b8;--card:#1a1a24;--border:#2a2a3a;
}
body.mode-h{
  --accent:#be185d;--accent2:#ec4899;
}
body.theme-light{
  --bg:#f5f7fb;--bg2:#ffffff;--bg3:#eef2f7;
  --text:#111827;--muted:#64748b;--card:#ffffff;--border:#d7dde8;
}
body.theme-light.mode-h{
  --accent:#db2777;--accent2:#be185d;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;}

/* NAV */
nav{background:var(--bg2);border-bottom:1px solid var(--border);padding:0 16px;height:56px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:200;}
.menu-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--text);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .2s;}
.menu-btn:hover{border-color:var(--accent);color:#fff;}
.menu-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;}
.logo{font-size:1.25rem;font-weight:800;color:var(--accent2);cursor:pointer;flex-shrink:0;user-select:none;white-space:nowrap;}
.logo span{color:var(--text);}

/* MODE TOGGLE */
.mode-toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;flex-shrink:0;}
.mt-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 11px;border-radius:5px;font-size:.78rem;font-weight:600;transition:all .18s;white-space:nowrap;}
.mt-btn.on{background:var(--accent);color:#fff;}
.theme-toggle{display:flex;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:3px;gap:2px;width:max-content;}
.theme-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:5px 10px;border-radius:5px;font-size:.75rem;font-weight:800;transition:all .18s;white-space:nowrap;}
.theme-btn.on{background:var(--accent);color:#fff;}

/* SEARCH */
.sb{flex:1;max-width:400px;position:relative;}
.sb input{width:100%;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 36px 8px 12px;border-radius:8px;font-size:.875rem;outline:none;transition:border .2s;}
.sb input:focus{border-color:var(--accent);}
.sb button{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;}
.nbtns{display:flex;gap:4px;margin-left:auto;}
.nbtns button{background:none;border:none;color:var(--muted);cursor:pointer;padding:6px 11px;border-radius:6px;font-size:.82rem;transition:all .2s;white-space:nowrap;}
.nbtns button:hover,.nbtns button.on{background:var(--bg3);color:var(--text);}

/* DRAWER */
.drawer-scrim{position:fixed;inset:0;background:rgba(0,0,0,.58);z-index:500;opacity:0;pointer-events:none;transition:opacity .22s;}
.drawer-scrim.open{opacity:1;pointer-events:auto;}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);background:var(--bg2);border-right:1px solid var(--border);z-index:501;transform:translateX(-105%);transition:transform .24s ease;display:flex;flex-direction:column;box-shadow:18px 0 50px rgba(0,0,0,.35);}
.drawer.open{transform:translateX(0);}
.drawer-head{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid var(--border);}
.drawer-title{font-weight:900;color:var(--accent2);letter-spacing:.02em;}
.drawer-close{width:34px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer;}
.drawer-body{padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;}
.drawer-block{background:rgba(255,255,255,.025);border:1px solid var(--border);border-radius:10px;padding:12px;}
.drawer-label{font-size:.67rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:9px;}
.drawer-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
.drawer-actions button,.drawer-wide-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:.8rem;cursor:pointer;text-align:left;transition:all .18s;}
.drawer-actions button:hover,.drawer-wide-btn:hover{border-color:var(--accent);background:rgba(124,58,237,.14);}
body.mode-h .drawer-actions button:hover,body.mode-h .drawer-wide-btn:hover{background:rgba(190,24,93,.14);}
.drawer-search{display:flex;gap:7px;}
.drawer-search input{min-width:0;flex:1;background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;outline:none;}
.drawer-search input:focus{border-color:var(--accent);}
.drawer-search button{border:none;background:var(--accent);color:#fff;border-radius:8px;padding:0 12px;cursor:pointer;font-weight:700;}
.drawer-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.drawer-stat{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:9px;text-align:center;}
.drawer-stat b{display:block;font-size:.95rem;color:var(--text);}
.drawer-stat span{font-size:.63rem;color:var(--muted);}
.about-card{display:flex;gap:11px;align-items:center;}
.about-avatar{width:64px;height:64px;border-radius:12px;object-fit:cover;background:var(--bg3);border:1px solid var(--border);flex-shrink:0;}
.about-copy b{display:block;font-size:.88rem;color:#fff;line-height:1.25;margin-bottom:4px;}
.about-copy span{display:block;font-size:.72rem;color:var(--muted);line-height:1.45;}
.about-pill{display:inline-flex;margin-top:7px;padding:3px 7px;border-radius:999px;background:rgba(124,58,237,.13);border:1px solid rgba(168,85,247,.35);color:var(--accent2);font-size:.64rem;font-weight:900;letter-spacing:.04em;text-transform:uppercase;}

/* HERO CAROUSEL */
.hero{position:relative;min-height:250px;border:1px solid var(--border);border-radius:12px;overflow:hidden;margin-bottom:18px;background:#050509;animation:heroIn .36s ease both;}
.hero.hero-out{opacity:0;transform:translateX(-22px);transition:opacity .24s ease,transform .24s ease;}
.hero-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:blur(18px) saturate(1.15);transform:scale(1.12);opacity:.45;}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,5,9,.95),rgba(5,5,9,.7) 48%,rgba(5,5,9,.18));}
.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:20px;align-items:end;min-height:250px;padding:24px;}
.hero-copy{max-width:760px;}
.hero-kicker{font-size:.7rem;text-transform:uppercase;letter-spacing:.12em;font-weight:900;color:var(--accent2);margin-bottom:8px;}
.hero-title{font-size:clamp(1.45rem,3vw,2.8rem);line-height:1.05;font-weight:900;margin-bottom:9px;}
.hero-meta{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px;color:var(--muted);font-size:.78rem;}
.hero-meta span{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:4px 9px;}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;}
.hero-actions button{border:none;border-radius:8px;padding:9px 15px;background:var(--accent);color:#fff;font-weight:800;cursor:pointer;}
.hero-actions button.secondary{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:var(--text);}
.hero-poster{width:160px;aspect-ratio:2/3;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,.16);background:var(--bg3);box-shadow:0 20px 48px rgba(0,0,0,.42);}
.hero-poster img{width:100%;height:100%;object-fit:cover;}
body.theme-light .hero{background:#fff;box-shadow:0 16px 42px rgba(15,23,42,.08);}
body.theme-light .hero-bg{opacity:.22;filter:blur(10px) saturate(1.08);}
body.theme-light .hero::after{background:linear-gradient(90deg,rgba(255,255,255,.96),rgba(255,255,255,.82) 52%,rgba(255,255,255,.46));}
body.theme-light .hero-title{color:#0f172a;text-shadow:none;}
body.theme-light .hero-meta{color:#475569;}
body.theme-light .hero-meta span{background:rgba(15,23,42,.06);border-color:rgba(15,23,42,.11);color:#475569;}
body.theme-light .hero-actions button.secondary{background:rgba(15,23,42,.06);border-color:rgba(15,23,42,.14);color:#0f172a;}
body.theme-light .hero-poster{box-shadow:0 18px 38px rgba(15,23,42,.18);border-color:rgba(15,23,42,.14);}
.feature-strip{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:18px;}
.feature-chip{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:12px;}
.feature-chip b{display:block;font-size:.84rem;margin-bottom:3px;}
.feature-chip span{font-size:.68rem;color:var(--muted);}
@keyframes heroIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:translateX(0)}}
@media(max-width:760px){
  nav .mode-toggle,nav .sb,nav .nbtns{display:none!important;}
  nav{justify-content:flex-start;}
  .hero{min-height:310px;}
  .hero-bg{opacity:.72;filter:blur(9px) saturate(1.1);transform:scale(1.05);}
  .hero::after{background:linear-gradient(90deg,rgba(5,5,9,.94),rgba(5,5,9,.72) 58%,rgba(5,5,9,.3));}
  body.theme-light .hero-bg{opacity:.26;filter:blur(8px) saturate(1.05);}
  body.theme-light .hero::after{background:linear-gradient(90deg,rgba(255,255,255,.97),rgba(255,255,255,.84) 58%,rgba(255,255,255,.48));}
  .hero-inner{grid-template-columns:minmax(0,1fr) 104px;min-height:310px;padding:18px;gap:12px;align-items:end;}
  .hero-poster{display:block;width:104px;align-self:end;}
  .feature-strip{grid-template-columns:1fr 1fr;}
}
@media(max-width:520px){
  .feature-strip{grid-template-columns:1fr}
  .hero-title{font-size:1.45rem}
  .hero-inner{grid-template-columns:minmax(0,1fr) 82px;padding:16px;gap:10px;}
  .hero-poster{width:82px;border-radius:8px;}
  .hero-meta{gap:5px;margin-bottom:10px;}
  .hero-meta span{font-size:.67rem;padding:3px 7px;}
}

/* SEARCH DROPDOWN */
.sdd{position:absolute;top:calc(100%+6px);left:0;right:0;background:var(--bg2);border:1px solid var(--border);border-radius:10px;max-height:360px;overflow-y:auto;z-index:300;display:none;}
.sdd.open{display:block;}
.sdi{display:flex;gap:10px;padding:9px 12px;cursor:pointer;align-items:center;border-bottom:1px solid var(--border);}
.sdi:last-child{border-bottom:none;}.sdi:hover{background:var(--bg3);}
.sdi img{width:32px;height:46px;object-fit:cover;border-radius:4px;flex-shrink:0;background:var(--bg3);}
.sdi-n{font-size:.82rem;font-weight:600;}.sdi-s{font-size:.7rem;color:var(--muted);margin-top:2px;}

/* PAGES */
main{max-width:1400px;margin:0 auto;padding:20px 16px;}
#pg-home,#pg-watch{display:none;}
#pg-home.active,#pg-watch.active{display:block;}

/* SECTION */
.sec-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.sec-hd h2{font-size:1rem;font-weight:700;}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:12px;margin-bottom:20px;}
.card{background:var(--card);border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .2s,box-shadow .2s;border:1px solid var(--border);}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(124,58,237,.3);}
body.mode-h .card:hover{box-shadow:0 8px 20px rgba(190,24,93,.3);}
.ct{position:relative;padding-top:140%;background:var(--bg3);}
.ct img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;}
.cb-type{position:absolute;top:5px;left:5px;background:var(--accent);color:#fff;font-size:.6rem;font-weight:700;padding:2px 6px;border-radius:3px;}
.cb-ep{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.75);font-size:.6rem;padding:2px 5px;border-radius:3px;display:flex;gap:4px;}
.cb-dur{position:absolute;bottom:5px;left:5px;background:rgba(0,0,0,.75);font-size:.6rem;padding:2px 5px;border-radius:3px;}
.cb-views{position:absolute;bottom:5px;right:5px;background:rgba(0,0,0,.75);font-size:.6rem;padding:2px 5px;border-radius:3px;color:#fde68a;}
.sub-c{color:#6ee7b7;}.dub-c{color:#93c5fd;}
.ci{padding:7px 9px 9px;}
.ci-t{font-size:.77rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ci-s{font-size:.68rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
.ci-meta span{font-size:.58rem;line-height:1;background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:3px 5px;border-radius:999px;}

/* SKELETON */
.skel{background:var(--card);border:1px solid var(--border);border-radius:10px;overflow:hidden;height:auto;min-height:225px;}
.skel-poster{height:166px;background:linear-gradient(90deg,var(--bg3),#272738,var(--bg3));background-size:220% 100%;animation:shine 1.15s ease-in-out infinite;}
.skel-line{height:9px;margin:9px 9px 0;border-radius:999px;background:linear-gradient(90deg,var(--bg3),#272738,var(--bg3));background-size:220% 100%;animation:shine 1.15s ease-in-out infinite;}
.skel-line.short{width:58%;}
.skel-line.tiny{width:38%;height:7px;margin-bottom:10px;}
.player-skel{position:absolute;inset:0;background:#050509;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.player-skel::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 0%,rgba(255,255,255,.07) 42%,rgba(255,255,255,.13) 50%,rgba(255,255,255,.07) 58%,transparent 100%);transform:translateX(-100%);animation:shimmer 1.35s linear infinite;}
.player-skel-inner{position:relative;z-index:1;width:min(420px,72%);display:flex;flex-direction:column;align-items:center;gap:12px;}
.player-skel-play{width:58px;height:58px;border-radius:50%;background:var(--bg3);border:1px solid var(--border);}
.player-skel-bar{height:9px;border-radius:999px;background:var(--bg3);width:100%;}
.player-skel-bar.short{width:62%;}
@keyframes shine{0%{background-position:180% 0}100%{background-position:-80% 0}}
@keyframes shimmer{to{transform:translateX(100%)}}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent2);border-radius:50%;animation:rot .7s linear infinite;margin:28px auto;}
@keyframes rot{to{transform:rotate(360deg)}}

/* PAGINATION */
.pagination{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 0 28px;}
.pg-btn{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:6px 16px;border-radius:7px;cursor:pointer;font-size:.82rem;transition:all .2s;}
.pg-btn:hover:not(:disabled){border-color:var(--accent);color:var(--text);}
.pg-btn:disabled{opacity:.35;cursor:default;}
.pg-info{font-size:.82rem;color:var(--muted);min-width:80px;text-align:center;}
.load-more-wrap{display:flex;justify-content:center;margin:-4px 0 24px;}
.load-more-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text);padding:9px 22px;border-radius:999px;cursor:pointer;font-size:.82rem;font-weight:800;transition:all .2s;}
.load-more-btn:hover:not(:disabled){border-color:var(--accent);background:rgba(124,58,237,.16);}
body.mode-h .load-more-btn:hover:not(:disabled){background:rgba(190,24,93,.16);}
.load-more-btn:disabled{opacity:.5;cursor:default;}

/* GENRE / TAG PILLS */
.gpills{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:20px;}
.gp{padding:5px 13px;border-radius:18px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer;font-size:.78rem;transition:all .2s;}
.gp:hover,.gp.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* MODAL */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.78);z-index:400;display:none;align-items:center;justify-content:center;padding:16px;}
#modal-overlay.open{display:flex;}
#modal{background:var(--bg2);border:1px solid var(--border);border-radius:14px;width:100%;max-width:860px;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;}
.modal-top{display:flex;gap:18px;padding:20px;overflow-y:auto;flex:1;}
@media(max-width:600px){.modal-top{flex-direction:column;}}
.modal-poster{flex-shrink:0;width:140px;}
.modal-poster img{width:140px;height:200px;object-fit:cover;border-radius:8px;background:var(--bg3);}
.modal-info{flex:1;min-width:0;}
.modal-info h2{font-size:1.2rem;font-weight:800;margin-bottom:3px;line-height:1.3;}
.modal-jp{font-size:.75rem;color:var(--muted);margin-bottom:8px;}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;}
.tag{font-size:.67rem;padding:2px 7px;border-radius:4px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);}
.tag.a{background:rgba(124,58,237,.2);border-color:var(--accent);color:var(--accent2);}
body.mode-h .tag.a{background:rgba(190,24,93,.2);border-color:var(--accent);color:var(--accent2);}
.synopsis{font-size:.81rem;color:var(--muted);line-height:1.6;margin-bottom:10px;}
.meta-g{display:flex;flex-wrap:wrap;gap:12px;font-size:.77rem;color:var(--muted);}
.meta-g b{color:var(--text);}
.detail-panel{margin-top:12px;border:1px solid var(--border);border-radius:10px;background:rgba(255,255,255,.025);overflow:hidden;}
.detail-title{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;padding:10px 12px;border-bottom:1px solid var(--border);}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0;border-top:0;}
.detail-row{padding:9px 12px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);min-width:0;}
.detail-row:nth-child(2n){border-right:none;}
.detail-row b{display:block;font-size:.62rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px;}
.detail-row span{font-size:.78rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;}
@media(max-width:600px){.detail-grid{grid-template-columns:1fr}.detail-row{border-right:none}}
.modal-eps{flex-shrink:0;width:240px;border-left:1px solid var(--border);display:flex;flex-direction:column;}
@media(max-width:600px){.modal-eps{width:100%;border-left:none;border-top:1px solid var(--border);max-height:240px;}}
.modal-eps-hd{padding:12px 14px;font-size:.85rem;font-weight:700;border-bottom:1px solid var(--border);flex-shrink:0;}
.modal-eps-list{overflow-y:auto;flex:1;padding:6px;}
.modal-eps-list::-webkit-scrollbar{width:3px;}
.modal-eps-list::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}
.ep-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:7px;cursor:pointer;transition:background .15s;border:1px solid transparent;margin-bottom:3px;}
.ep-row:hover{background:var(--bg3);}
.ep-row.on{background:rgba(124,58,237,.15);border-color:var(--accent);}
body.mode-h .ep-row.on{background:rgba(190,24,93,.15);}
.ep-n{width:28px;height:28px;border-radius:5px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:700;color:var(--muted);flex-shrink:0;}
.ep-row.on .ep-n{background:var(--accent);color:#fff;}
.ep-t{font-size:.77rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ep-sd{font-size:.65rem;color:var(--muted);margin-top:1px;}
.modal-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0;}
.modal-close{background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:6px 16px;border-radius:7px;cursor:pointer;font-size:.82rem;}
.modal-close:hover{color:var(--text);}
.modal-status{font-size:.78rem;color:var(--muted);}

/* HANIME WATCH BUTTON */
.watch-now-btn{display:block;width:100%;padding:10px;margin-top:14px;border-radius:8px;background:var(--accent);border:none;color:#fff;font-size:.9rem;font-weight:700;cursor:pointer;transition:opacity .2s;}
.watch-now-btn:hover{opacity:.85;}

/* WATCH PAGE */
.back{display:inline-flex;align-items:center;gap:5px;background:var(--bg3);border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.82rem;transition:all .2s;margin-bottom:14px;}
.back:hover{color:var(--text);border-color:var(--accent);}
.watch-layout{display:grid;grid-template-columns:1fr 280px;gap:16px;}
@media(max-width:860px){.watch-layout{grid-template-columns:1fr;}}
.player-box{background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;position:relative;isolation:isolate;container-type:inline-size;}
.player-box video{width:100%;height:100%;display:block;background:#000;}

/* WATERMARK — top-right, subtle, never overlaps controls */
.player-box::after{content:"6stream";position:absolute;top:clamp(8px,2cqw,16px);right:clamp(10px,2cqw,18px);z-index:18;color:rgba(255,255,255,.28);font-size:clamp(.62rem,1.7cqw,1.1rem);font-weight:900;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 4px rgba(0,0,0,.7);pointer-events:none;user-select:none;}
/* Fullscreen watermark — top-right, slightly bigger */
.player-box:fullscreen::after,.player-box:-webkit-full-screen::after,.player-box.is-fullscreen::after{top:clamp(14px,2vh,28px);right:clamp(16px,2.5vw,36px);font-size:clamp(.9rem,1.6vw,1.5rem);color:rgba(255,255,255,.22);}

.watch-type-badge{position:absolute;top:10px;left:10px;z-index:19;padding:5px 9px;border-radius:999px;background:rgba(15,23,42,.78);border:1px solid rgba(255,255,255,.16);font-size:.68rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;backdrop-filter:blur(6px);}
.watch-type-inline{display:inline-flex;vertical-align:middle;margin-left:8px;padding:3px 8px;border-radius:999px;background:var(--bg3);border:1px solid var(--border);font-size:.68rem;font-weight:900;letter-spacing:.06em;text-transform:uppercase;}
.watch-type-inline.sub{color:#6ee7b7;border-color:rgba(16,185,129,.55);}
.watch-type-inline.dub{color:#93c5fd;border-color:rgba(59,130,246,.55);}
.watch-type-badge.sub{color:#6ee7b7;border-color:rgba(16,185,129,.5);}
.watch-type-badge.dub{color:#93c5fd;border-color:rgba(59,130,246,.5);}
.watch-type-badge.hls{color:#6ee7b7;border-color:rgba(16,185,129,.5);}
.watch-type-badge.mp4{color:#93c5fd;border-color:rgba(59,130,246,.5);}

/* VIDEO CONTROLS */
.video-controls{position:absolute;left:0;right:0;bottom:0;z-index:15;padding:36px 10px 8px;background:linear-gradient(transparent,rgba(0,0,0,.88));display:flex;flex-direction:column;gap:6px;opacity:1;transform:translateY(0);transition:opacity .22s ease,transform .22s ease;}
.player-box.controls-idle .video-controls{opacity:0;transform:translateY(18px);pointer-events:none;}
.player-box:not(.controls-idle):focus-within .video-controls{opacity:1;}
.vc-progress{width:100%;accent-color:var(--accent);cursor:pointer;height:4px;margin-bottom:2px;}
.vc-row{display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0;}
.vc-btn{flex-shrink:0;width:34px;height:34px;border-radius:7px;border:1px solid rgba(255,255,255,.18);background:rgba(15,23,42,.82);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;touch-action:manipulation;}
.vc-btn svg{width:16px;height:16px;display:block;stroke:currentColor;fill:none;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round;}
.vc-btn:hover,.vc-btn:active{background:var(--accent);}
.vc-time{font-size:.68rem;color:#e5e7eb;font-variant-numeric:tabular-nums;white-space:nowrap;flex-shrink:0;}
.vc-vol{width:70px;accent-color:var(--accent);flex-shrink:0;}
/* type badge inside controls — shows Sub/Dub/HLS */
.vc-type{flex-shrink:0;padding:3px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.22);font-size:.6rem;font-weight:900;letter-spacing:.07em;text-transform:uppercase;color:#e5e7eb;background:rgba(15,23,42,.72);white-space:nowrap;}
.vc-type.sub{color:#6ee7b7;border-color:rgba(16,185,129,.6);}
.vc-type.dub{color:#93c5fd;border-color:rgba(59,130,246,.6);}
.vc-spacer{flex:1;min-width:0;}
.vc-speed,.vc-sub,.vc-quality{background:rgba(15,23,42,.86);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:5px 6px;font-size:.72rem;outline:none;flex-shrink:0;max-width:90px;}
.vc-sub:disabled{display:none;}

/* SUBTITLE POSITION — stays above controls, works in fullscreen */
.player-box video::cue{background:rgba(0,0,0,.72);color:#fff;font-size:clamp(.8rem,2.4cqw,1.1rem);line-height:1.4;}
.player-box:not(.controls-idle) video{--cue-bottom:64px;}
.player-box.controls-idle video{--cue-bottom:12px;}
/* Fullscreen subtitle push — done via JS class on the wrap */
.player-box:fullscreen video::cue,.player-box:-webkit-full-screen video::cue,.player-box.is-fullscreen video::cue{font-size:clamp(1rem,2.2vw,1.4rem);}

.center-pop{position:absolute;left:50%;top:50%;z-index:20;width:72px;height:72px;border-radius:16px;background:rgba(0,0,0,.58);border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;color:#fff;transform:translate(-50%,-50%) scale(.82);opacity:0;pointer-events:none;animation:centerPop .58s ease forwards;backdrop-filter:blur(6px);}
.center-pop svg{width:34px;height:34px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
@keyframes centerPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.82)}18%{opacity:1;transform:translate(-50%,-50%) scale(1)}72%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.12)}}
/* Mobile controls */
@media(max-width:560px){
  .vc-vol{display:none;}
  .vc-time{font-size:.62rem;}
  .vc-btn{width:36px;height:36px;}
  .vc-btn svg{width:17px;height:17px;}
  .vc-speed,.vc-sub,.vc-quality{padding:5px 5px;font-size:.68rem;max-width:72px;}
  .video-controls{padding:30px 8px 6px;gap:5px;}
  .vc-progress{height:5px;margin-bottom:1px;}
}
.player-msg{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:.84rem;text-align:center;padding:20px;}
.player-msg .pi{font-size:2.2rem;}
.player-msg.err .pi{color:#ef4444;}
.sv-grp{margin:10px 0 4px;}
.sv-lbl{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);margin-bottom:6px;}
.sv-row{display:flex;flex-wrap:wrap;gap:6px;}
.sv-btn{padding:5px 12px;border-radius:6px;border:1px solid var(--border);background:var(--bg3);color:var(--muted);cursor:pointer;font-size:.77rem;transition:all .2s;}
.sv-btn:hover{border-color:var(--accent);color:var(--text);}
.sv-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}
.sv-btn.sub.on{background:#065f46;border-color:#10b981;color:#6ee7b7;}
.sv-btn.dub.on{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd;}
.sv-btn.hls.on{background:#065f46;border-color:#10b981;color:#6ee7b7;}
.sv-btn.mp4.on{background:#1e3a5f;border-color:#3b82f6;color:#93c5fd;}
.download-panel{margin-top:10px;border:1px solid var(--border);background:var(--bg2);border-radius:8px;padding:10px;display:none;align-items:center;justify-content:space-between;gap:10px;}
.download-panel.show{display:flex;}
.download-copy{min-width:0;}
.download-title{font-size:.78rem;font-weight:900;color:var(--text);}
.download-note{font-size:.68rem;color:var(--muted);margin-top:2px;}
.download-btn{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;border:1px solid rgba(124,58,237,.55);background:var(--accent);color:#fff;text-decoration:none;border-radius:7px;padding:8px 12px;font-size:.76rem;font-weight:900;}
.download-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
.download-btn:hover{filter:brightness(1.08);}
@media(max-width:560px){.download-panel{align-items:flex-start;flex-direction:column}.download-btn{width:100%;justify-content:center;}}
.watch-eps{display:flex;flex-direction:column;max-height:calc(100vh - 120px);}
.w-ep-hd{font-size:.87rem;font-weight:700;margin-bottom:8px;flex-shrink:0;}
.w-ep-scroll{overflow-y:auto;flex:1;}
.w-ep-scroll::-webkit-scrollbar{width:3px;}
.w-ep-scroll::-webkit-scrollbar-thumb{background:var(--accent);border-radius:2px;}

/* RELATED HANIME ITEM */
.rel-item{display:flex;gap:8px;padding:7px 0;cursor:pointer;border-bottom:1px solid var(--border);transition:opacity .15s;}
.rel-item:last-child{border-bottom:none;}
.rel-item:hover{opacity:.75;}
.rel-thumb{flex-shrink:0;width:64px;height:42px;border-radius:5px;overflow:hidden;background:var(--bg3);}
.rel-thumb img{width:100%;height:100%;object-fit:cover;}
.rel-info{flex:1;min-width:0;}
.rel-title{font-size:.72rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.rel-meta{font-size:.65rem;color:var(--muted);margin-top:2px;}

/* TOAST */
#toast{position:fixed;bottom:18px;right:18px;background:var(--bg2);border:1px solid var(--border);padding:10px 16px;border-radius:9px;font-size:.82rem;transform:translateY(50px);opacity:0;transition:all .25s;z-index:999;max-width:280px;}
#toast.show{transform:translateY(0);opacity:1;}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:.87rem;}
.err-box{background:rgba(239,68,68,.1);border:1px solid #ef4444;border-radius:8px;padding:10px 14px;color:#fca5a5;font-size:.81rem;margin-bottom:10px;}

/* RESPONSIVE SYSTEM */
@media(min-width:1500px){
  main{max-width:1560px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px;}
  .hero{min-height:300px;}
  .hero-inner{min-height:300px;grid-template-columns:minmax(0,1fr) 210px;padding:30px;}
  .hero-poster{width:190px;}

}

  .nbtns button{padding:6px 9px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(132px,1fr));}
  .watch-layout{grid-template-columns:1fr 250px;}
}
@media(max-width:960px){
  nav .nbtns{display:none!important;}
  .sb{max-width:none;}
  main{padding:16px 12px;}
  .hero-inner{grid-template-columns:minmax(0,1fr) 145px;gap:16px;padding:20px;}
  .hero-poster{width:135px;}
  .feature-strip{grid-template-columns:repeat(2,1fr);}
  #modal{max-width:calc(100vw - 24px);}
  .watch-layout{grid-template-columns:1fr;}
  .watch-eps{max-height:none;}
  .w-ep-scroll{max-height:360px;}
}
@media(max-width:760px){
  body{font-size:15px;}
  nav{height:54px;padding:0 10px;}
  .logo{font-size:1.12rem;}
  .drawer{width:min(360px,92vw);}
  main{padding:12px 10px;}
  .hero{border-radius:10px;min-height:300px;margin-bottom:12px;}
  .hero::after{background:linear-gradient(0deg,rgba(5,5,9,.96),rgba(5,5,9,.62));}
  .hero-inner{min-height:300px;padding:18px;align-items:end;}
  .hero-title{font-size:clamp(1.35rem,7vw,2rem);}
  .hero-meta{gap:5px;margin-bottom:9px;font-size:.72rem;}
  .hero-meta span{padding:3px 7px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .hero-actions button{flex:1;min-width:120px;padding:9px 10px;}
  .grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:9px;}
  .ci{padding:7px;}
  .ci-t{font-size:.72rem;}
  .ci-s{font-size:.63rem;}
  .ci-meta span{font-size:.55rem;padding:3px 4px;}
  .cb-type,.cb-ep,.cb-dur,.cb-views{font-size:.55rem;}
  #modal-overlay{padding:8px;align-items:stretch;}
  #modal{max-height:calc(100dvh - 16px);border-radius:10px;}
  .modal-top{padding:14px;gap:12px;}
  .modal-poster{width:110px;}
  .modal-poster img{width:110px;height:156px;}
  .modal-info h2{font-size:1.02rem;}
  .synopsis{font-size:.76rem;line-height:1.5;}
  .modal-bar{padding:10px 12px;}
  .watch-layout{gap:12px;}
  .player-box{border-radius:8px;}
  .video-controls{padding:28px 9px 8px;gap:6px;}
  .vc-row{gap:6px;flex-wrap:wrap;}
  .vc-progress{height:4px;}
  .vc-speed{margin-left:auto;}
  .vc-sub{max-width:118px;}
  .center-pop{width:66px;height:66px;border-radius:16px;}
  .center-pop svg{width:32px;height:32px;}
  .sv-row{gap:5px;}
  .sv-btn{padding:6px 10px;}
  .rel-thumb{width:58px;height:38px;}
  #toast{left:10px;right:10px;bottom:12px;max-width:none;text-align:center;}
}
@media(max-width:520px){
  .menu-btn{width:36px;height:36px;}
  .drawer-body{padding:10px;gap:10px;}
  .drawer-block{padding:10px;border-radius:9px;}
  .drawer-actions{grid-template-columns:1fr;}
  .drawer-stats{grid-template-columns:1fr;}

  .pg-info{min-width:auto;font-size:.74rem;}

  .modal-poster{width:96px;}
  .modal-poster img{width:96px;height:136px;}
  .modal-eps{max-height:220px;}

  .vc-speed{max-width:64px;font-size:.65rem;}

@media(max-width:370px){

  .watch-layout{grid-template-columns:1fr 220px;}
  .watch-eps{max-height:calc(100vh - 80px);}
  .video-controls{padding-top:22px;}
}

/* INTRO OVERLAY */
.intro-overlay{position:absolute;inset:0;z-index:30;background:#050509;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;animation:introOut .5s 1.9s ease forwards;pointer-events:none;}
.intro-logo{font-size:clamp(2rem,8cqw,4.2rem);font-weight:900;letter-spacing:.14em;text-transform:uppercase;color:#ffffff;text-shadow:0 0 28px rgba(255,255,255,.55),0 0 72px rgba(168,85,247,.4);animation:introWhoosh .62s .04s cubic-bezier(.22,.68,0,1.2) both;}
.intro-bar{width:min(240px,58%);height:3px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
.intro-fill{height:100%;border-radius:999px;background:rgba(255,255,255,.7);animation:introFill 1.65s ease forwards;}
.intro-by{font-size:.7rem;color:rgba(255,255,255,.42);letter-spacing:.16em;text-transform:uppercase;animation:introIn .5s .38s ease both;}
@keyframes introWhoosh{from{opacity:0;transform:translateX(-60px) scaleX(.7);filter:blur(8px)}to{opacity:1;transform:translateX(0) scaleX(1);filter:blur(0)}}
@keyframes introIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes introFill{from{width:0}to{width:100%}}
@keyframes introOut{to{opacity:0;transform:scale(1.04)}}

/* SKIP INTRO BTN */
.skip-intro-btn{position:absolute;bottom:80px;right:14px;z-index:20;background:rgba(15,23,42,.88);color:#fff;border:1px solid rgba(255,255,255,.22);padding:7px 16px;border-radius:7px;cursor:pointer;font-size:.77rem;font-weight:700;backdrop-filter:blur(6px);display:none;transition:background .15s;}
.skip-intro-btn:hover{background:var(--accent);}
@media(max-width:560px){.skip-intro-btn{bottom:72px;right:9px;font-size:.7rem;padding:6px 11px;}}

/* QUALITY SELECTOR */
.vc-quality{background:rgba(15,23,42,.86);border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:6px;padding:5px 7px;font-size:.74rem;outline:none;cursor:pointer;}
.vc-quality option{background:#1a1a2e;color:#fff;}

/* AUTO-NEXT EPISODE */
.auto-next-overlay{position:absolute;inset:0;z-index:40;background:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(3px);}
.auto-next-card{background:rgba(15,23,42,.96);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:22px 26px;text-align:center;min-width:210px;max-width:290px;box-shadow:0 20px 60px rgba(0,0,0,.55);}
.an-label{font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:900;margin-bottom:5px;}
.an-ep{font-size:.87rem;font-weight:700;color:#fff;line-height:1.35;margin-bottom:16px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.an-ring{position:relative;width:60px;height:60px;margin:0 auto 14px;}
.an-ring svg{width:60px;height:60px;transform:rotate(-90deg);}
.an-ring circle{fill:none;stroke-width:4;}
.an-ring-bg{stroke:rgba(255,255,255,.1);}
.an-ring-fill{stroke:var(--accent2);stroke-dasharray:164;stroke-dashoffset:0;stroke-linecap:round;animation:anCountRing 4s linear forwards;}
.an-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:1.5rem;font-weight:900;color:#fff;}
.an-btns{display:flex;gap:8px;justify-content:center;}
.an-btn{border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);color:#fff;border-radius:8px;padding:7px 14px;font-size:.77rem;font-weight:700;cursor:pointer;transition:all .18s;}
.an-btn:hover{background:rgba(255,255,255,.16);}
.an-btn.primary{background:var(--accent);border-color:var(--accent);}
.an-btn.primary:hover{filter:brightness(1.1);}
@keyframes anCountRing{from{stroke-dashoffset:0}to{stroke-dashoffset:164}}

/* DOUBLE-TAP / DOUBLE-CLICK SEEK OVERLAY */
.seek-flash{position:absolute;top:0;bottom:0;width:42%;z-index:25;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.seek-flash.left{left:0;border-radius:0 50% 50% 0/0 100% 100% 0;}
.seek-flash.right{right:0;border-radius:50% 0 0 50%/100% 0 0 100%;}
.seek-flash::before{content:'';position:absolute;inset:0;background:rgba(255,255,255,.16);animation:seekRipple .52s ease forwards;}
.sf-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;animation:seekFadeInOut .52s ease forwards;}
.sf-inner svg{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 1px 5px rgba(0,0,0,.75));}
.sf-inner span{color:#fff;font-size:.82rem;font-weight:900;text-shadow:0 1px 5px rgba(0,0,0,.8);letter-spacing:.04em;}
@keyframes seekRipple{0%{opacity:0;transform:scaleX(.55)}18%{opacity:1;transform:scaleX(1)}78%{opacity:.85}100%{opacity:0;transform:scaleX(1.08)}}
@keyframes seekFadeInOut{0%{opacity:0;transform:scale(.7)}20%{opacity:1;transform:scale(1)}75%{opacity:1}100%{opacity:0;transform:scale(1.05)}}

/* INSPECT GUARD */
.inspect-guard{position:fixed;inset:0;z-index:9999;background:rgba(5,5,9,.94);backdrop-filter:blur(14px);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;}
.inspect-guard.on{display:flex;}
.inspect-card{max-width:420px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:22px;box-shadow:0 26px 80px rgba(0,0,0,.5);}
.inspect-card b{display:block;font-size:1.1rem;margin-bottom:8px;color:#fff;}
.inspect-card span{display:block;color:var(--muted);font-size:.86rem;line-height:1.5;}
.inspect-card small{display:block;margin-top:12px;color:var(--accent2);font-weight:800;text-transform:uppercase;letter-spacing:.08em;}
.inspect-card button{margin-top:16px;border:none;border-radius:8px;background:var(--accent);color:#fff;font-weight:900;padding:9px 18px;cursor:pointer;}
body.theme-light .inspect-card b{color:#0f172a;}
</style>

<body>

<div id="toast"></div>

<script>
const API_ORIGIN = window.location.origin.replace(/\/$/, '');
const API = `${API_ORIGIN}/api`;

// ── State ─────────────────────────────────────────────────────────────────────
let mode = 'anime'; // 'anime' | 'h'
let currentSlug = null, currentEps = [], currentSvs = [], currentPage = 1;
let currentSection = 'home';
let activeEpIdx = -1;
let homeLoadId = 0;
let heroIndex = 0;
let heroItems = [];
let heroKind = 'anime';
let heroTimer = null;
const loadStores = {};

// Hanime watch state
let hCurrentSources = [], hCurrentRelated = [];

// Frontend cache
const cache = new Map();
function cget(k){ const v=cache.get(k); return v&&Date.now()-v.t<180000?v.d:null; }
function cset(k,d){ cache.set(k,{d,t:Date.now()}); }

// ── Utils ─────────────────────────────────────────────────────────────────────
async function api(path){
  const cached = cget(path);
  if(cached) return cached;
  const r = await fetch(API_ORIGIN + path);
  const j = await r.json();
  if(!j.success) throw new Error(j.message||'API error');
  cset(path, j);
  return j;
}

function toast(msg, ok=true){
  const el=document.getElementById('toast');
  el.textContent=msg; el.style.borderColor=ok?'var(--accent)':'#ef4444';
  el.classList.add('show'); clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),2800);
}
function spin(){ return '<div class="spin"></div>'; }
function skels(n=12){
  return Array.from({length:n},()=>`<div class="skel">
    <div class="skel-poster"></div>
    <div class="skel-line"></div>
    <div class="skel-line short"></div>
    <div class="skel-line tiny"></div>
  </div>`).join('');
}
function playerSkeleton(text='Loading video...'){
  return `<div class="player-skel">
    <div class="player-skel-inner">
      <div class="player-skel-play"></div>
      <div class="player-skel-bar"></div>
      <div class="player-skel-bar short"></div>
      <div style="color:var(--muted);font-size:.78rem;">${text}</div>
    </div>
  </div>`;
}
function serverSkeleton(){
  return `<div class="sv-grp"><div class="sv-lbl">Servers</div><div class="sv-row">
    <button class="sv-btn" disabled>Loading</button>
    <button class="sv-btn" disabled>Sub</button>
    <button class="sv-btn" disabled>Dub</button>
  </div></div>`;
}
function safeFileName(name){
  return String(name||'video')
    .replace(/[\\/:*?"<>|]+/g,' ')
    .replace(/\s+/g,' ')
    .trim()
    .slice(0,110) || 'video';
}
function downloadIcon(){
  return '<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>';
}
function clearDownload(){
  const panel=document.getElementById('download-panel');
  if(!panel) return;
  panel.classList.remove('show');
  panel.innerHTML='';
}
function setDownload(url, title='HD Download', note='6Stream source download', filename='6Stream-jhamesmartin-video.mp4'){
  const panel=document.getElementById('download-panel');
  if(!panel || !url) return;
  panel.innerHTML=`<div class="download-copy">
    <div class="download-title">${title}</div>
    <div class="download-note">${note}</div>
  </div>
  <a class="download-btn" href="${url}" target="_blank" rel="noopener" download="${filename}">${downloadIcon()}<span>Download</span></a>`;
  panel.classList.add('show');
}

function showPage(id){
  if(id!=='home') clearInterval(heroTimer);
  document.querySelectorAll('#pg-home,#pg-watch').forEach(p=>p.classList.remove('active'));
  document.getElementById('pg-'+id).classList.add('active');
  document.querySelectorAll('.nbtns button').forEach(b=>b.classList.remove('on'));
  window.scrollTo(0,0);
}

function openDrawer(){
  const d=document.getElementById('drawer');
  d?.classList.add('open');
  d?.removeAttribute('inert');
  document.getElementById('drawer-scrim')?.classList.add('open');
}
function closeDrawer(){
  const d=document.getElementById('drawer');
  d?.classList.remove('open');
  d?.setAttribute('inert','');
  document.getElementById('drawer-scrim')?.classList.remove('open');
}
function drawerSearch(){
  const dq=document.getElementById('drawer-q');
  const q=(dq?.value||'').trim();
  if(!q) return;
  qi.value=q;
  closeDrawer();
  doSearch();
}

function setTheme(theme){
  const next=theme==='light'?'light':'dark';
  document.body.classList.toggle('theme-light', next==='light');
  ['th-dark','d-th-dark'].forEach(id=>document.getElementById(id)?.classList.toggle('on', next==='dark'));
  ['th-light','d-th-light'].forEach(id=>document.getElementById(id)?.classList.toggle('on', next==='light'));
  localStorage.setItem('sixstream-theme', next);
}

function initTheme(){
  const saved=localStorage.getItem('sixstream-theme');
  const prefersLight=window.matchMedia&&window.matchMedia('(prefers-color-scheme: light)').matches;
  setTheme(saved || (prefersLight?'light':'dark'));
}

function fmtViews(n){
  if(!n) return '';
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(0)+'K';
  return n;
}
function fmtDur(sec){
  if(!sec) return '';
  const m=Math.floor(sec/60), s=sec%60;
  return `${m}:${String(s).padStart(2,'0')}`;
}

// ── MODE ──────────────────────────────────────────────────────────────────────
function setMode(m){
  mode = m;
  document.body.classList.toggle('mode-h', m==='h');
  document.getElementById('mt-anime').classList.toggle('on', m==='anime');
  document.getElementById('mt-h').classList.toggle('on', m==='h');
  document.getElementById('d-mt-anime')?.classList.toggle('on', m==='anime');
  document.getElementById('d-mt-h')?.classList.toggle('on', m==='h');
  document.getElementById('nbtns-anime').style.display = m==='anime'?'flex':'none';
  document.getElementById('nbtns-h').style.display     = m==='h'?'flex':'none';
  document.getElementById('drawer-anime').style.display = m==='anime'?'block':'none';
  document.getElementById('drawer-h').style.display = m==='h'?'block':'none';
  document.querySelector('#qi').placeholder = m==='h' ? 'Search 18+ videos...' : 'Search anime...';
  sdd.classList.remove('open');
  goHome();
}

// ── ANIME CARDS ───────────────────────────────────────────────────────────────
function card(a){
  const safeslug=(a.slug||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const sub=a.sub?`<span class="sub-c">S${a.sub}</span>`:'';
  const dub=a.dub?`<span class="dub-c">D${a.dub}</span>`:'';
  const meta=[
    a.type,
    a.score?`Score ${a.score}`:null,
    a.aired,
    a.sub?`Sub ${a.sub}`:null,
    a.dub?`Dub ${a.dub}`:null,
  ].filter(Boolean).slice(0,3);
  return `<div class="card" onclick="openModal('${safeslug}')">
    <div class="ct">
      <img src="${a.poster||''}" loading="lazy" onerror="this.style.opacity=0"/>
      ${a.type?`<span class="cb-type">${a.type}</span>`:''}
      ${sub||dub?`<div class="cb-ep">${sub}${dub}</div>`:''}
    </div>
    <div class="ci">
      <div class="ci-t">${a.title||''}</div>
      ${a.titleJP&&a.titleJP!==a.title?`<div class="ci-s">${a.titleJP}</div>`:''}
      ${meta.length?`<div class="ci-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>`:''}
    </div>
  </div>`;
}

// Route hanime-cdn.com images through our proxy (403 without Referer)
function hImg(url){ return url ? `${API_ORIGIN}/api/img-proxy?url=${encodeURIComponent(url)}` : ''; }

// ── HANIME CARDS ──────────────────────────────────────────────────────────────
function hCard(v){
  const safeslug=(v.slug||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const imgSrc=hImg(v.poster||v.cover||'');
  const dur=v.duration?`<span class="cb-dur">${fmtDur(v.duration)}</span>`:'';
  const views=v.views?`<span class="cb-views">Views ${fmtViews(v.views)}</span>`:'';
  const firstTag=v.tags&&v.tags[0]?`<div class="ci-s">${v.tags.slice(0,3).join(', ')}</div>`:'';
  const meta=[
    v.duration?fmtDur(v.duration):null,
    v.views?`Views ${fmtViews(v.views)}`:null,
    v.likes?`Likes ${fmtViews(v.likes)}`:null,
  ].filter(Boolean).slice(0,3);
  return `<div class="card" onclick="hOpenModal('${safeslug}')">
    <div class="ct">
      <img src="${imgSrc}" loading="lazy" onerror="this.style.opacity=0"/>
      ${dur}${views}
    </div>
    <div class="ci">
      <div class="ci-t">${v.title||''}</div>
      ${firstTag}
      ${meta.length?`<div class="ci-meta">${meta.map(m=>`<span>${m}</span>`).join('')}</div>`:''}
    </div>
  </div>`;
}

function paginationHTML(page, hasMore, onPrev, onNext){
  return `<div class="pagination">
    <button class="pg-btn" onclick="${onPrev}" ${page<=1?'disabled':''}>Prev</button>
    <span class="pg-info">Page ${page}</span>
    <button class="pg-btn" onclick="${onNext}" ${!hasMore?'disabled':''}>Next</button>
  </div>`;
}

function loadMoreButton(key, label='Load More'){
  return `<div class="load-more-wrap"><button class="load-more-btn" id="lm-${key}" onclick="appendLoadMore('${key}')">${label}</button></div>`;
}

function setupLoadGrid(key, gridId, items, renderer, step=24){
  loadStores[key]={gridId,items,renderer,step,shown:0};
  appendLoadMore(key,true);
}

function appendLoadMore(key, reset=false){
  const st=loadStores[key];
  if(!st) return;
  const grid=document.getElementById(st.gridId);
  if(!grid) return;
  if(reset){ st.shown=0; grid.innerHTML=''; }
  const next=st.items.slice(st.shown, st.shown+st.step);
  if(!next.length && reset){ grid.innerHTML='<div class="empty">Nothing.</div>'; }
  grid.insertAdjacentHTML('beforeend', next.map(st.renderer).join(''));
  st.shown+=next.length;
  const btn=document.getElementById('lm-'+key);
  if(btn){
    btn.style.display=st.shown<st.items.length?'inline-flex':'none';
    btn.textContent=st.shown<st.items.length?`Load More (${st.items.length-st.shown})`:'All loaded';
  }
}

async function loadMoreSec(name,page){
  const btn=document.getElementById('lm-sec');
  if(btn){ btn.disabled=true; btn.textContent='Loading...'; }
  try{
    const d=await api(`/api/${name}?page=${page}`);
    const items=d.data||[];
    document.getElementById('g-main')?.insertAdjacentHTML('beforeend', items.map(card).join(''));
    if(btn){
      if(items.length>=20){ btn.disabled=false; btn.textContent='Load More'; btn.onclick=()=>loadMoreSec(name,page+1); }
      else btn.style.display='none';
    }
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Try Again'; } toast(e.message,false); }
}

async function hLoadMoreSec(name,page){
  const btn=document.getElementById('lm-hsec');
  if(btn){ btn.disabled=true; btn.textContent='Loading...'; }
  try{
    const d=await api(`/api/hanime/${name}?page=${page}`);
    const items=d.data||[];
    document.getElementById('g-main')?.insertAdjacentHTML('beforeend', items.map(hCard).join(''));
    if(btn){
      if(items.length>=24){ btn.disabled=false; btn.textContent='Load More'; btn.onclick=()=>hLoadMoreSec(name,page+1); }
      else btn.style.display='none';
    }
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='Try Again'; } toast(e.message,false); }
}

function heroHTML(items=[], kind='anime'){
  heroItems=items.slice(0,8);
  heroKind=kind;
  heroIndex=0;
  if(!heroItems.length) return '';
  setTimeout(startHeroAuto,0);
  return renderHero();
}

function renderHero(){
  const item=heroItems[heroIndex]||heroItems[0];
  if(!item) return '';
  const rawImg=item.poster||item.cover||'';
  const img=heroKind==='h'?hImg(rawImg):rawImg;
  const title=item.title||'Featured title';
  const sub=heroKind==='h'
    ? [item.duration?fmtDur(item.duration):null,item.views?`Views ${fmtViews(item.views)}`:null,(item.tags||[]).slice(0,2).join(', ')]
    : [item.type,item.sub?`Sub ${item.sub}`:null,item.dub?`Dub ${item.dub}`:null,item.titleJP];
  const safe=(item.slug||'').replace(/\\/g,'\\\\').replace(/'/g,"\\'");
  const primary=heroKind==='h'?`hOpenModal('${safe}')`:`openModal('${safe}')`;
  const secondary=heroKind==='h'?`hLoadSec('trending')`:`loadSec('popular')`;
  const position=`${heroIndex+1} of ${heroItems.length}`;
  const extra=heroKind==='h'
    ? [`ID ${item.id||'N/A'}`, item.likes?`Likes ${fmtViews(item.likes)}`:null, position]
    : [item.slug?`Slug ${item.slug}`:null, item.sub||item.dub?`${(item.sub||0)+(item.dub||0)} listed episodes`:null, position];
  return `<section class="hero" id="hero">
    <div class="hero-bg" style="background-image:url('${img}')"></div>
    <div class="hero-inner">
      <div class="hero-copy">
        <div class="hero-kicker">${heroKind==='h'?'Featured 18+':'Featured Anime'}</div>
        <div class="hero-title">${title}</div>
        <div class="hero-meta">${sub.filter(Boolean).slice(0,4).map(x=>`<span>${x}</span>`).join('')}</div>
        <div class="hero-meta">${extra.filter(Boolean).slice(0,3).map(x=>`<span>${x}</span>`).join('')}</div>
        <div class="hero-actions">
          <button onclick="${primary}">Open Details</button>
          <button class="secondary" onclick="${secondary}">Browse More</button>
        </div>
      </div>
      <div class="hero-poster"><img src="${img}" loading="lazy" onerror="this.style.opacity=0"></div>
    </div>
  </section>
  <div class="feature-strip">
    <div class="feature-chip"><b>Complete Free</b><span>Watch without paid unlocks.</span></div>
    <div class="feature-chip"><b>No Ads</b><span>Clean app shell and direct watch flow.</span></div>
  </div>`;
}

function startHeroAuto(){
  clearInterval(heroTimer);
  if(heroItems.length<2) return;
  heroTimer=setInterval(()=>moveHero(1),3800);
}

function moveHero(step){
  if(!heroItems.length) return;
  heroIndex=(heroIndex+step+heroItems.length)%heroItems.length;
  const el=document.getElementById('hero');
  if(!el) return;
  el.classList.add('hero-out');
  setTimeout(()=>{
    const fresh=document.getElementById('hero');
    if(fresh) fresh.outerHTML=renderHero().split('<div class="feature-strip">')[0];
  },220);
}

// ── ANIME HOME ────────────────────────────────────────────────────────────────
async function goHome(){
  stopCurrentVideo();
  const loadId=++homeLoadId;
  showPage('home'); closeModal();
  currentSection='home'; currentPage=1;
  document.querySelectorAll('.nbtns button').forEach(b=>b.classList.remove('on'));

  if(mode==='h'){ hGoHome(loadId); return; }

  const c=document.getElementById('home-content');
  c.innerHTML=`
    <div class="sec-hd"><h2>Recent Updates</h2></div>
    <div class="grid" id="g-recent">${skels()}</div>
    <div class="sec-hd" style="margin-top:8px"><h2>Most Popular</h2></div>
    <div class="grid" id="g-pop">${skels()}</div>`;
  try{
    const d=await api('/api/all');
    if(loadId!==homeLoadId || mode!=='anime') return;
    const recent=(d.data.recent?.length?d.data.recent:d.data.latest)||[];
    const popular=d.data.popular||[];
    c.innerHTML=`
      ${heroHTML(popular.length?popular:recent,'anime')}
      <div class="sec-hd"><h2>Recent Updates</h2></div>
      <div class="grid" id="g-recent"></div>
      ${loadMoreButton('home-recent')}
      <div class="sec-hd" style="margin-top:8px"><h2>Most Popular</h2></div>
      <div class="grid" id="g-pop"></div>
      ${loadMoreButton('home-pop')}`;
    setupLoadGrid('home-recent','g-recent',recent,card,24);
    setupLoadGrid('home-pop','g-pop',popular,card,24);
  }catch(e){
    if(loadId!==homeLoadId || mode!=='anime') return;
    c.innerHTML=`<div class="err-box">! ${e.message} - Is npm start running?</div>`;
  }
}

function stopCurrentVideo(){
  if(_activeHls){ try{ _activeHls.destroy(); }catch(_){} _activeHls=null; }
  const v=document.querySelector('#player video');
  if(v){ try{ v.pause(); v.removeAttribute('src'); v.load(); }catch(_){} }
  const wrap=document.getElementById('player');
  if(wrap){
    wrap.classList.remove('controls-idle');
    wrap.innerHTML='<div class="player-msg"><div class="pi">▶</div><div>Select a video</div></div>';
  }
}

function initInspectGuard(){
  const guard=document.createElement('div');
  guard.className='inspect-guard';
  guard.innerHTML=`<div class="inspect-card">
    <b>Protected Player</b>
    <span>Developer tools were detected. Video playback is paused while inspection is open.</span>
    <small>6stream security</small>
    <button type="button" id="inspect-continue">Continue</button>
  </div>`;
  document.body.appendChild(guard);

  let lastState=false;
  let detectHits=0;
  const pauseAll=()=>{
    document.querySelectorAll('video').forEach(v=>{ try{ v.pause(); }catch(_){} });
  };
  const setLocked=(state)=>{
    if(state===lastState) return;
    lastState=state;
    guard.classList.toggle('on', state);
    document.body.style.overflow=state?'hidden':'';
    if(state) pauseAll();
  };
  const detect=()=>{
    const gapW=Math.abs((window.outerWidth||0)-(window.innerWidth||0));
    const gapH=Math.abs((window.outerHeight||0)-(window.innerHeight||0));
    const suspected=gapW>320 || gapH>320;
    detectHits=suspected?detectHits+1:0;
    setLocked(detectHits>=3);
  };
  guard.querySelector('#inspect-continue').onclick=()=>{
    detectHits=0;
    setLocked(false);
  };
  const block=(e)=>{
    e.preventDefault();
    e.stopPropagation();
    return false;
  };
  const blockHard=(e)=>{
    block(e);
    detectHits=3;
    setLocked(true);
    return false;
  };

  window.addEventListener('resize',detect);
  window.addEventListener('focus',detect);
  document.addEventListener('visibilitychange',detect);
  document.addEventListener('contextmenu',block,true);
  document.addEventListener('dragstart',block,true);
  document.addEventListener('copy',block,true);
  document.addEventListener('cut',block,true);
  document.addEventListener('keydown',(e)=>{
    const key=(e.key||'').toLowerCase();
    const blocked=e.key==='F12' ||
      (e.ctrlKey&&e.shiftKey&&['i','j','c'].includes(key)) ||
      (e.ctrlKey&&['u','s','p','c','x','a'].includes(key));
    if(blocked){
      return blockHard(e);
    }
  },true);

  setInterval(detect,2500);
  detect();
}

async function selectEp(idx){
  stopCurrentVideo();
  clearDownload();
  activeEpIdx=idx;
  const ep=currentEps[idx]; if(!ep) return;
  document.querySelectorAll('.ep-row[id^=wep-]').forEach(r=>r.classList.remove('on'));
  document.getElementById('wep-'+idx)?.classList.add('on');
  document.getElementById('wep-'+idx)?.scrollIntoView({behavior:'smooth',block:'nearest'});
  const epBadges=[ep.sub?'<span class="watch-type-inline sub">Sub</span>':'', ep.dub?'<span class="watch-type-inline dub">Dub</span>':''].join('');
  document.getElementById('watch-title').innerHTML=`${ep.title||`Episode ${ep.epNum}`}${epBadges}`;
  document.getElementById('player').innerHTML=playerSkeleton('Loading servers...');
  document.getElementById('servers').innerHTML=serverSkeleton();
  try{
    const d=await api(`/api/servers?key=${encodeURIComponent(ep.serverKey)}`);
    currentSvs=d.data;
    renderServers(currentSvs);
    const firstSub=currentSvs.findIndex(s=>s.type==='sub');
    selectServer(firstSub>=0?firstSub:0);
  }catch(e){
    document.getElementById('player').innerHTML=`<div class="player-msg err"><div class="pi">!</div><div>${e.message}</div></div>`;
    toast(e.message,false);
  }
}

function renderServers(svs){
  const sub=svs.filter(s=>s.type==='sub');
  const dub=svs.filter(s=>s.type==='dub');
  let h='';
  if(sub.length) h+=`<div class="sv-grp"><div class="sv-lbl">Sub</div><div class="sv-row">${sub.map(s=>{const i=svs.indexOf(s);return`<button class="sv-btn sub" id="sv-${i}" onclick="selectServer(${i})">${s.name}</button>`;}).join('')}</div></div>`;
  if(dub.length) h+=`<div class="sv-grp"><div class="sv-lbl">Dub</div><div class="sv-row">${dub.map(s=>{const i=svs.indexOf(s);return`<button class="sv-btn dub" id="sv-${i}" onclick="selectServer(${i})">${s.name}</button>`;}).join('')}</div></div>`;
  document.getElementById('servers').innerHTML=h;
}

async function selectServer(idx){
  const sv=currentSvs[idx]; if(!sv) return;
  clearDownload();
  document.querySelectorAll('.sv-btn').forEach(b=>b.classList.remove('on'));
  document.getElementById('sv-'+idx)?.classList.add('on');
  const badge=sv.type==='dub'
    ? {label:'Dub', cls:'dub'}
    : {label:'Sub', cls:'sub'};
  document.getElementById('player').innerHTML=playerSkeleton(`Getting ${badge.label} stream...`);
  try{
    const srcD=await api(`/api/source/${encodeURIComponent(sv.linkId)}`);
    const embedUrl=srcD.data?.url; if(!embedUrl) throw new Error('No embed URL');
    const playerD=await api(`/api/player?url=${encodeURIComponent(embedUrl)}`);
    const m3u8=playerD.sources?.[0]?.url; if(!m3u8) throw new Error('No stream found');
    const pm=`${API}/hls?url=${encodeURIComponent(m3u8)}`;
    const ep=currentEps[activeEpIdx]||{};
    const baseName=safeFileName(`${currentSlug||'anime'} episode ${ep.epNum||activeEpIdx+1}`);
    const downloadUrl=`${API}/hls-download?url=${encodeURIComponent(m3u8)}&name=${encodeURIComponent(baseName)}`;
    const ps=(playerD.subtitles||[]).map(s=>({...s,url:`${API}/hls?url=${encodeURIComponent(s.url)}`}));
    playHLS(pm, ps, playerD.intro, playerD.outro, badge);
    setDownload(downloadUrl, 'HD Download', `Full video MP4 (${sv.type.toUpperCase()} - ${sv.name})`, `6Stream-jhamesmartin-${baseName}.mp4`);
    toast(`${sv.name} (${sv.type.toUpperCase()})`, true);
  }catch(e){
    document.getElementById('player').innerHTML=`<div class="player-msg err"><div class="pi">!</div><div>${e.message}<br><small>Try another server.</small></div></div>`;
    toast(e.message,false);
  }
}

function hWatchPage(data){
  stopCurrentVideo();
  clearDownload();
  hCurrentSources=data.sources||[];
  hCurrentRelated=data.related||[];
  showPage('watch');
  document.getElementById('watch-err').innerHTML='';
  document.getElementById('watch-title').textContent=data.title||'';
  document.getElementById('player').innerHTML='<div class="player-msg"><div class="pi">Play</div><div>Select quality</div></div>';

  // Quality selector
  const hlsSrcs    = hCurrentSources.filter(s=>s.kind==='hls');
  const directSrcs = hCurrentSources.filter(s=>s.kind==='mp4'||s.kind==='direct');
  let svHTML='';
  if(hlsSrcs.length){
    svHTML+=`<div class="sv-grp"><div class="sv-lbl">Stream</div><div class="sv-row">`;
    hlsSrcs.forEach(s=>{
      const gi=hCurrentSources.indexOf(s);
      svHTML+=`<button class="sv-btn hls" id="hsv-${gi}" onclick="hSelectSource(${gi})">${s.quality}</button>`;
    });
    svHTML+=`</div></div>`;
  }
  if(directSrcs.length){
    svHTML+=`<div class="sv-grp"><div class="sv-lbl">Direct</div><div class="sv-row">`;
    directSrcs.forEach(s=>{
      const gi=hCurrentSources.indexOf(s);
      svHTML+=`<button class="sv-btn mp4" id="hsv-${gi}" onclick="hSelectSource(${gi})">${s.quality}</button>`;
    });
    svHTML+=`</div></div>`;
  }
  if(!hCurrentSources.length) {
    const err = data.sourceError ? ` Source scrape failed: ${data.sourceError}` : '';
    svHTML=`<div class="empty" style="padding:8px;">No sources found.${err}</div>`;
  }
  document.getElementById('servers').innerHTML=svHTML;

  // Related sidebar
  document.getElementById('w-ep-title').textContent=`Related (${hCurrentRelated.length})`;
  document.getElementById('w-ep-list').innerHTML=hCurrentRelated.slice(0,20).map(r=>`
    <div class="rel-item" onclick="hOpenModal('${(r.slug||'').replace(/'/g,"\\'")}')">
      <div class="rel-thumb"><img src="${hImg(r.poster||r.cover||'')}" loading="lazy" onerror="this.style.opacity=0"/></div>
      <div class="rel-info">
        <div class="rel-title">${r.title||''}</div>
        <div class="rel-meta">${r.duration?fmtDur(r.duration):''} ${r.views?'· Views '+fmtViews(r.views):''}</div>
      </div>
    </div>`).join('') || '<div class="empty" style="padding:16px;font-size:.78rem">No related.</div>';

  // Auto-select: prefer direct files first, then real scraped HLS streams.
  if(hCurrentSources.length){
    let preferred = hCurrentSources.findIndex(s=>s.kind==='mp4'||s.kind==='direct');
    if(preferred<0) preferred = hCurrentSources.findIndex(s=>s.kind==='hls');
    hSelectSource(preferred>=0?preferred:0);
  }
}

function hSelectSource(idx){
  stopCurrentVideo();

  const src=hCurrentSources[idx]; if(!src) return;
  document.querySelectorAll('[id^=hsv-]').forEach(b=>b.classList.remove('on'));
  document.getElementById('hsv-'+idx)?.classList.add('on');

  const wrap=document.getElementById('player');

  if(src.kind==='mp4'){
